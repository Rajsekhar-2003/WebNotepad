    <!-- Theme initialization -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('webnotepad:theme');

          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }

          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
